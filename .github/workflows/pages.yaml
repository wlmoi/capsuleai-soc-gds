name: GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'gds/**'
      - 'layout/**'
      - '.github/workflows/pages.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble site and layout files
        run: |
          mkdir -p _site/assets
          cp site/index.html site/styles.css site/viewer.js site/die-viewer.js _site/
          cp layout/preview.png layout/placement.json layout/sg13g2-preview.lyp _site/assets/
          cp -r layout/layers _site/assets/
          cp gds/capsoc_floorplan.gds gds/capsoc_floorplan.oas _site/assets/
          cp gds/capsoc_explorer.oas _site/tinytapeout-view.oas
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
